buildscript: lzc/build.sh
manifest: lzc-manifest.yml
pkgout: release/
icon: lzc/icon.png
images:
  magpie:
    # generated from the upstream Dockerfile by the buildscript; the context
    # is the repo so the Go build stage copies the synced source in
    dockerfile: lzc/gen/Dockerfile
    context: .
    # build on the box's Lazycat Developer Tools, matching its real arch;
    # `local` builds with the local docker instead (buildx, linux/amd64)
    builder: remote
